<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Tajawal:wght@500;700&display=swap');
  html, body { margin: 0; background: #2a2a2a; }
  #stage { box-shadow: 0 0 40px rgba(0,0,0,.4); }
  #scrub { position: fixed; left: 0; bottom: 0; width: 1080px; z-index: 10; }
</style>
</head>
<body>
  <div id="stage"></div>
  <input id="scrub" type="range" min="0" max="12000" value="0" step="16" />
  <script type="module">
    import { buildScene } from './src/scene.js';
    import { applyState } from './src/timeline.js';
    const stage = document.getElementById('stage');
    const layers = buildScene(stage, document);
    window.__layers = layers;
    window.seek = (t) => applyState(t, layers);
    const scrub = document.getElementById('scrub');
    const params = new URLSearchParams(location.search);
    if (params.get('capture') === '1') scrub.style.display = 'none';
    scrub.addEventListener('input', () => window.seek(Number(scrub.value)));
    window.seek(0);
  </script>
</body>
</html>
